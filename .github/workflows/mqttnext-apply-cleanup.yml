name: mqttnext apply cleanup

on:
  pull_request:
    paths:
      - "mqttnext/tools/cleanup-focus.*"
      - ".github/workflows/mqttnext-apply-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mqttnext-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore reviewed cleanup tree
        shell: bash
        run: |
          echo "1f61221484a33a618d69fb2bd6b33210eb789603e52e44d8fefff74cb8ba3193  mqttnext/tools/cleanup-focus.00" | sha256sum -c -
          echo "4e36c35e3b1f9f7c7b0af3a11086a3865eacc94af14f9b50af8f032668554ced  mqttnext/tools/cleanup-focus.01a" | sha256sum -c -
          echo "51c78b7a6e94dae30220fbf460876216d4b9c3472f40e7564dd705a10437b612  mqttnext/tools/cleanup-focus.01b" | sha256sum -c -
          echo "4a18991549fe2c899131b4eb5718ae42b504f74f9fe05b721eb9ea36719db4e0  mqttnext/tools/cleanup-focus.02" | sha256sum -c -
          echo "3fb441dac0d62a29bfb42087817d60e05da5ecd7f0fc7e1121a8095b2c395530  mqttnext/tools/cleanup-focus.03a" | sha256sum -c -
          echo "71bc1dc2100d95d7c9ba305087cfc27741e44ddada7737582fe8c6b7f49cbb49  mqttnext/tools/cleanup-focus.03b" | sha256sum -c -
          echo "03a0ef7e17e800845775b2b1b44c99b1fa38f2d73e2e20223f3f8d6f83edb603  mqttnext/tools/cleanup-focus.04" | sha256sum -c -
          echo "505da567d0c35a7014928a0a2b8c3c0dc686e2bd9d38fa051c7e820d4181b054  mqttnext/tools/cleanup-focus.05" | sha256sum -c -
          echo "5517de0fa81db6ebe05c1636ca67c123d76fb1eb919bdfcfe6d5b3e8c627e6eb  mqttnext/tools/cleanup-focus.06" | sha256sum -c -
          echo "1ecfbac1c6c6ad08058fda10c9610398b9acc13744ea28116525e501f997d890  mqttnext/tools/cleanup-focus.07" | sha256sum -c -
          cat \
            mqttnext/tools/cleanup-focus.00 \
            mqttnext/tools/cleanup-focus.01a \
            mqttnext/tools/cleanup-focus.01b \
            mqttnext/tools/cleanup-focus.02 \
            mqttnext/tools/cleanup-focus.03a \
            mqttnext/tools/cleanup-focus.03b \
            mqttnext/tools/cleanup-focus.04 \
            mqttnext/tools/cleanup-focus.05 \
            mqttnext/tools/cleanup-focus.06 \
            mqttnext/tools/cleanup-focus.07 \
            | base64 -d > /tmp/mqttnext-cleanup.tgz
          echo "2761e90c20eed8b70219cd029486814055de7895772d716ad990697a61cc4f0c  /tmp/mqttnext-cleanup.tgz" | sha256sum -c -
          tar -xzf /tmp/mqttnext-cleanup.tgz -C mqttnext
          rm -rf mqttnext/benchmarks/results
          rm -f \
            mqttnext/docs/AUDIT.md \
            mqttnext/docs/AUDIT-CORRECTNESS.md \
            mqttnext/docs/AUDIT-FINAL.md \
            mqttnext/docs/AUDIT-REMEDIATION-PLAN.md \
            mqttnext/docs/PERF-SPRINT.md
          cat > MQTTNEXT.md <<'EOF'
          # MQTTNext

          The async-native MQTT rewrite lives under [`mqttnext/`](mqttnext/).

          - architecture and constraints: `mqttnext/docs/DESIGN.md`;
          - active roadmap: `mqttnext/docs/ROADMAP.md`;
          - Paho compatibility and migration: `mqttnext/docs/COMPAT.md`, `mqttnext/docs/MIGRATION.md`;
          - benchmark contract: `mqttnext/benchmarks/README.md`;
          - standalone package: `mqttnext/src/mqttnext`.

          Historical audits and generated benchmark snapshots remain available in Git history and GitHub Actions artifacts rather than in the maintained documentation tree.

          The historical Eclipse Paho implementation under `src/paho/` is not modified by this initiative.
          EOF
      - name: Install package and quality tools
        working-directory: mqttnext
        run: pip install -e ".[dev]" paho-mqtt==2.1.0 gmqtt==0.7.0
      - name: Format and static validation
        working-directory: mqttnext
        run: |
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttnext
      - name: Unit tests and coverage
        working-directory: mqttnext
        run: python -m pytest -q tests/unit --cov=mqttnext --cov-report=term-missing --cov-fail-under=80
      - name: Strict asyncio and warning validation
        working-directory: mqttnext
        env:
          PYTHONASYNCIODEBUG: "1"
          PYTHONTRACEMALLOC: "5"
          PYTHONWARNINGS: "error::ResourceWarning,error::RuntimeWarning,error::DeprecationWarning:mqttnext"
        run: python -X dev -m pytest -q tests/unit --strict-config --strict-markers
      - name: Focused performance smoke
        working-directory: mqttnext
        run: |
          python benchmarks/micro_baseline.py
          python benchmarks/application_stress.py --output /tmp/application-stress.json
      - name: Publish validated cleanup
        shell: bash
        run: |
          git config user.name "mqttnext cleanup agent"
          git config user.email "actions@users.noreply.github.com"
          git add MQTTNEXT.md mqttnext
          git reset -- mqttnext/tools/cleanup-focus.* mqttnext/tools/cleanup_audit.py mqttnext/tools/cleanup-core.part*
          git commit -m "simplify transports, helpers, persistence, tests, and docs"
          git push origin HEAD:${{ github.head_ref }}
