name: mqttnext

on:
  push:
    paths:
      - "mqttnext/**"
      - ".github/workflows/mqttnext.yml"
  pull_request:
    paths:
      - "mqttnext/**"
      - ".github/workflows/mqttnext.yml"

permissions:
  contents: write

jobs:
  agent_apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/mqttnext-hardening-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mqttnext-hardening-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused quality linting
        run: |
          if grep -q '^\[tool.ruff.lint\]' mqttnext/pyproject.toml; then
            echo "Quality lint batch already applied"
            exit 0
          fi
          python mqttnext/tools/apply_quality_lint.py
          python mqttnext/tools/finalize_quality_lint.py
      - name: Install package and quality tools
        run: pip install -e './mqttnext[dev]'
      - name: Apply safe Ruff fixes
        working-directory: mqttnext
        run: ruff check src tests --fix
      - name: Enforce focused Ruff rules
        working-directory: mqttnext
        run: ruff check src tests
      - name: Run unit regressions
        run: python -m pytest -q mqttnext/tests/unit
      - name: Validate and push
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name 'mqttnext-hardening-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add mqttnext/src mqttnext/tests mqttnext/pyproject.toml
          git commit -m '[agent-quality] add focused Ruff quality gate'
          git push origin HEAD:agent/mqttnext-hardening-audit

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: mqttnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q tests/unit
      - name: Start Mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosq-ci.conf
          mosquitto -c /tmp/mosq-ci.conf -d
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Integration tests
        run: python -m pytest -q tests/integration

  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mqttnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[fuzz]"
      - name: Fuzz (seeded, bounded)
        run: |
          for seed in 1 2 3; do
            PYTHONPATH=src python3 tests/fuzz/fuzz.py --seed $seed --iterations 20000
          done
      - name: Fuzz (hypothesis, guided + shrinking)
        run: PYTHONPATH=src python3 -m pytest tests/fuzz/test_hypothesis_fuzz.py -q
