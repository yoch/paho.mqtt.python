name: mqttnext apply hardening

on:
  pull_request:
    paths:
      - "mqttnext/tools/*hardening*.py"
      - ".github/workflows/mqttnext-apply-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mqttnext-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed transformations
        run: |
          python mqttnext/tools/patch_hardening_scripts.py
          python mqttnext/tools/patch_hardening_contracts.py
          python mqttnext/tools/apply_hardening_core.py
          python mqttnext/tools/apply_hardening_tests.py
          python mqttnext/tools/apply_hardening_bench.py
          rm mqttnext/tools/patch_hardening_scripts.py
          rm mqttnext/tools/patch_hardening_contracts.py
          rm mqttnext/tools/apply_hardening_core.py
          rm mqttnext/tools/apply_hardening_tests.py
          rm mqttnext/tools/apply_hardening_bench.py
          rm .github/workflows/mqttnext-apply-hardening.yml
      - name: Install validation dependencies
        working-directory: mqttnext
        run: |
          pip install -e ".[dev]" paho-mqtt==2.1.0 gmqtt==0.7.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
      - name: Format and lint
        working-directory: mqttnext
        run: |
          ruff format src tests benchmarks
          ruff check --fix src tests benchmarks
          ruff check src tests benchmarks
      - name: Type check
        working-directory: mqttnext
        run: mypy src/mqttnext
      - name: Unit tests
        working-directory: mqttnext
        run: python -m pytest -q tests/unit
      - name: Start benchmark broker
        run: |
          printf 'listener 11883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mqttnext-hardening-mosq.conf
          mosquitto -c /tmp/mqttnext-hardening-mosq.conf -d
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/11883) >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          exit 1
      - name: Comparable benchmark smoke
        working-directory: mqttnext
        run: python benchmarks/compare_libs.py --count 1000 --output /tmp/compare.json
      - name: Confirmed delivery benchmark smoke
        working-directory: mqttnext
        run: python benchmarks/realworld.py --count 500 --output /tmp/realworld.json
      - name: Commit hardened implementation
        run: |
          git config user.name "mqttnext hardening agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "harden mqttnext production delivery and performance"
          git push origin HEAD:${{ github.head_ref }}
