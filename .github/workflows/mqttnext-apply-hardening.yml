name: mqttnext apply hardening

on:
  pull_request:
    paths:
      - "mqttnext/tools/apply_hardening_*.py"
      - ".github/workflows/mqttnext-apply-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mqttnext-production-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed transformations
        run: |
          python mqttnext/tools/apply_hardening_core.py
          python mqttnext/tools/apply_hardening_tests.py
          python mqttnext/tools/apply_hardening_bench.py
          rm mqttnext/tools/apply_hardening_core.py
          rm mqttnext/tools/apply_hardening_tests.py
          rm mqttnext/tools/apply_hardening_bench.py
          rm .github/workflows/mqttnext-apply-hardening.yml
      - name: Install quality tools
        working-directory: mqttnext
        run: pip install -e ".[dev]"
      - name: Format and lint
        working-directory: mqttnext
        run: |
          ruff format src tests benchmarks
          ruff check --fix src tests benchmarks
          ruff check src tests benchmarks
      - name: Type check
        working-directory: mqttnext
        run: mypy src/mqttnext
      - name: Unit tests
        working-directory: mqttnext
        run: python -m pytest -q tests/unit
      - name: Commit hardened implementation
        run: |
          git config user.name "mqttnext hardening agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "harden mqttnext production delivery and performance"
          git push origin HEAD:${{ github.head_ref }}
