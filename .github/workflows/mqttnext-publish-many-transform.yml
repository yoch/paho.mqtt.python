name: mqttnext publish many transformer

on:
  pull_request:
    branches:
      - agent/mqttnext-core-perf-optimizations
    paths:
      - mqttnext/tools/apply_publish_many.py
      - .github/workflows/mqttnext-publish-many-transform.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mqttnext-publish-many'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mqttnext-publish-many
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        working-directory: mqttnext
        run: pip install -e '.[dev]'
      - name: Apply publish_many implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mqttnext/tools/apply_publish_many.py')
          text = path.read_text()
          start = text.index('    replace_once(\n        "mqttnext/README.md",')
          end = text.index('\n\n    Path(__file__).unlink()', start)
          replacement = '''    replace_once(
              "mqttnext/README.md",
              """## Development
          """,
              """## Batch publishing

          `AsyncClient.publish_many()` accepts immutable `PublishMessage` entries and
          returns one `PublishBatchReceipt`. QoS 0 publications are queued in bounded
          chunks with one engine lock/effect flush per chunk. QoS 1/2 share one aggregate
          completion tracker; the negotiated inflight window is continuously refilled
          without spawning a task or event for each packet identifier.

          ```python
          from mqttnext.api import PublishMessage

          receipt = await client.publish_many(
              [PublishMessage("sensors/temperature", payload, qos=1) for payload in payloads]
          )
          await receipt.wait()
          ```

          ## Development
          """,
          )'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python mqttnext/tools/apply_publish_many.py
      - name: Format and lint
        working-directory: mqttnext
        run: |
          ruff format src tests
          ruff check src tests
      - name: Type check
        working-directory: mqttnext
        run: mypy src
      - name: Unit tests
        working-directory: mqttnext
        run: PYTHONPATH=. pytest tests/unit -q
      - name: Commit production implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add aggregate publish_many pipeline'
          git push origin HEAD:agent/mqttnext-publish-many
