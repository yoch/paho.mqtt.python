name: mqttnext publish many transformer

on:
  pull_request:
    branches:
      - agent/mqttnext-core-perf-optimizations
    paths:
      - mqttnext/tools/apply_publish_many.py
      - .github/workflows/mqttnext-publish-many-transform.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mqttnext-publish-many'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mqttnext-publish-many
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        working-directory: mqttnext
        run: pip install -e '.[dev]'
      - name: Apply publish_many implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mqttnext/tools/apply_publish_many.py')
          text = path.read_text()
          text = text.replace(
              '        "mqttnext/README.md",\n        \'\'\'## Persistence\\n\'\'\',',
              '        "mqttnext/README.md",\n        \'\'\'## Development\\n\'\'\',',
              1,
          )
          text = text.replace(
              '\\n## Persistence\\n\'\'\',\n    )',
              '\\n## Development\\n\'\'\',\n    )',
              1,
          )
          path.write_text(text)
          PY
          python mqttnext/tools/apply_publish_many.py
      - name: Format and lint
        working-directory: mqttnext
        run: |
          ruff format src tests
          ruff check src tests
      - name: Type check
        working-directory: mqttnext
        run: mypy src
      - name: Unit tests
        working-directory: mqttnext
        run: PYTHONPATH=. pytest tests/unit -q
      - name: Commit production implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add aggregate publish_many pipeline'
          git push origin HEAD:agent/mqttnext-publish-many
