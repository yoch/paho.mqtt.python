name: mqttnext apply epoch fixes

on:
  pull_request:
    paths:
      - "mqttnext/tools/patch_epoch_flush.py"
      - ".github/workflows/mqttnext-apply-epoch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/mqttnext-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply epoch and wakeup fixes
        run: python mqttnext/tools/patch_epoch_flush.py
      - name: Install quality tools
        working-directory: mqttnext
        run: pip install -e ".[dev]"
      - name: Format and validate
        working-directory: mqttnext
        run: |
          ruff format src tests benchmarks
          ruff check src tests benchmarks
          mypy src/mqttnext
          python -m pytest -q tests/unit
      - name: Publish validated source changes
        run: |
          git config user.name "mqttnext hardening agent"
          git config user.email "actions@users.noreply.github.com"
          git add mqttnext/src mqttnext/tests
          git commit -m "close connection epoch and scheduled flush races"
          git push origin HEAD:${{ github.head_ref }}
