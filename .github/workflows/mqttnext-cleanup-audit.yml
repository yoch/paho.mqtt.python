name: mqttnext cleanup audit

on:
  pull_request:
    paths:
      - "mqttnext/tools/cleanup_audit.py"
      - ".github/workflows/mqttnext-cleanup-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/mqttnext-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        working-directory: mqttnext
        run: pip install -e ".[dev]" pylint vulture radon
      - name: Collect maintainability diagnostics
        working-directory: mqttnext
        shell: bash
        run: |
          mkdir -p /tmp/mqttnext-cleanup
          python tools/cleanup_audit.py \
            > /tmp/mqttnext-cleanup/ast-audit.md
          ruff check src tests benchmarks \
            --select B,C4,PERF,PIE,RET,RUF,SIM,UP \
            --output-format concise \
            > /tmp/mqttnext-cleanup/ruff-extra.txt || true
          pylint src/mqttnext \
            --disable=all \
            --enable=duplicate-code,too-many-branches,too-many-locals,too-many-nested-blocks,too-many-return-statements,too-many-statements \
            --reports=n \
            > /tmp/mqttnext-cleanup/pylint-structure.txt || true
          vulture src/mqttnext --min-confidence 80 \
            > /tmp/mqttnext-cleanup/vulture.txt || true
          radon cc src/mqttnext -s -a \
            > /tmp/mqttnext-cleanup/radon-cc.txt
          radon mi src/mqttnext -s \
            > /tmp/mqttnext-cleanup/radon-mi.txt
      - name: Strict unit tests and slow-test inventory
        working-directory: mqttnext
        env:
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: "error::ResourceWarning,error::RuntimeWarning,error::DeprecationWarning:mqttnext"
        run: |
          python -X dev -m pytest -q tests/unit \
            --strict-config --strict-markers --durations=25 \
            | tee /tmp/mqttnext-cleanup/strict-tests.txt
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqttnext-cleanup-audit-${{ github.run_id }}
          path: /tmp/mqttnext-cleanup
          if-no-files-found: error
          retention-days: 7
