name: agent-patch

on:
  push:
    branches:
      - agent/mqttnext-hardening-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mqttnext-hardening-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        run: git apply --check mqttnext/tools/agent-batch2.patch && git apply mqttnext/tools/agent-batch2.patch
      - name: Install package
        run: pip install -e './mqttnext[dev]'
      - name: Run focused tests
        run: python -m pytest -q mqttnext/tests/unit/test_engine_hardening_batch2.py mqttnext/tests/unit/test_qos_engine.py mqttnext/tests/unit/test_qos2_matrix.py mqttnext/tests/unit/test_session_semantics.py
      - name: Validate diff
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name 'mqttnext-hardening-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add mqttnext/src/mqttnext/protocol/engine.py mqttnext/tests/unit/test_engine_hardening_batch2.py
          git commit -m '[agent-patch] harden protocol engine invariants'
          git push origin HEAD:agent/mqttnext-hardening-audit
