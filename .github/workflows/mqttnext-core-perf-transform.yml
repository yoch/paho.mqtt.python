name: mqttnext core performance transformer

on:
  push:
    branches:
      - agent/mqttnext-core-perf-optimizations
    paths:
      - mqttnext/tools/apply_core_perf_optimizations.py
      - .github/workflows/mqttnext-core-perf-transform.yml
  pull_request:
    branches:
      - agent/mqttnext-production-hardening
    paths:
      - mqttnext/tools/apply_core_perf_optimizations.py
      - .github/workflows/mqttnext-core-perf-transform.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/mqttnext-core-perf-optimizations'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mqttnext-core-perf-optimizations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mqttnext development dependencies
        working-directory: mqttnext
        run: pip install -e '.[dev]'
      - name: Apply measured optimizations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mqttnext/tools/apply_core_perf_optimizations.py')
          text = path.read_text()
          text = text.replace(
              '        return _row_to_out(row) if row else None\n\n    def update_out',
              '        return _row_to_out(row)\n\n    def update_out',
              1,
          )
          text = text.replace('if count != 4:', 'if count != 5:', 1)
          text = text.replace(
              'expected four pop_out calls',
              'expected five pop_out calls',
              1,
          )
          path.write_text(text)
          PY
          python mqttnext/tools/apply_core_perf_optimizations.py
      - name: Format and lint
        working-directory: mqttnext
        run: |
          ruff format src tests
          ruff check src tests
      - name: Type check
        working-directory: mqttnext
        run: mypy src
      - name: Unit tests
        working-directory: mqttnext
        run: pytest tests/unit -q
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: optimize delivery, effects, topics, and store deletes'
          git push origin HEAD:agent/mqttnext-core-perf-optimizations
